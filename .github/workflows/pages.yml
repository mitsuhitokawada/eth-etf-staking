# docs/ フォルダの中身を GitHub Pages に公開するワークフロー
# main に push されるたびに自動で再公開される
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Pages を設定（未有効なら有効化）
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: docs/ をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
